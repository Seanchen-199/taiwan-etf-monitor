name: 每日自動抓取台股資料

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 台灣時間 15:30 收盤後
    - cron: '0 1 * * 1-5'    # 台灣時間 09:00 開盤前
  workflow_dispatch:

jobs:
  fetch-and-model:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 步驟1：抓取原始資料
        run: python fetch_data.py

      - name: 步驟2：執行多因子模型
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python model.py

      - name: 提交並推送結果
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add raw_data.json model_output.json
          git diff --staged --quiet || git commit -m "📊 模型更新：$(date '+%Y/%m/%d %H:%M') 台灣時間"
          git push
