name: 每日自動抓取台股資料

on:
  schedule:
    # 每天台灣時間 15:30 執行（UTC 07:30，收盤後）
    - cron: '30 7 * * 1-5'
    # 每天台灣時間 09:00 執行（UTC 01:00，開盤前預熱）
    - cron: '0 1 * * 1-5'
  workflow_dispatch:  # 允許手動觸發

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行資料抓取腳本
        run: python fetch_data.py

      - name: 提交並推送 data.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data.json
          git diff --staged --quiet || git commit -m "📊 自動更新：$(date '+%Y/%m/%d %H:%M') 台灣時間"
          git push
